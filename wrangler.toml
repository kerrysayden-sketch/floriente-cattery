# Cloudflare Pages config. Because `pages_build_output_dir` is set, Cloudflare
# Pages treats THIS FILE as the source of truth for deployment bindings
# (top-level = Production, [env.preview] = Preview deployments). It is also
# used by `wrangler pages dev` for local function testing.
#
# Local run:
#   npm run build              # produces dist/ (needs STORYBLOK_TOKEN)
#   npm run pages:dev          # serves dist/ + runs functions/ with .dev.vars
#
# Runtime secrets come from .dev.vars locally (gitignored) and from the
# Cloudflare Pages project env/secrets in preview/production. See WAITLIST-SETUP.md.

name = "floriente-cattery"
pages_build_output_dir = "dist"
compatibility_date = "2024-11-01"

# D1 storage binding (`WAITLIST_DB`). database_id is an identifier, not a secret.
# Production deployments use floriente-waitlist-prod; Preview deployments use
# floriente-waitlist-preview. Local `wrangler pages dev` creates a SQLite under
# .wrangler/ regardless of the id.
[[d1_databases]]
binding = "WAITLIST_DB"
database_name = "floriente-waitlist-prod"
database_id = "a6708ec0-9e79-4fa3-87b7-7152aca4ced8"

[[env.preview.d1_databases]]
binding = "WAITLIST_DB"
database_name = "floriente-waitlist-preview"
database_id = "8b4c5c8f-27ce-4d59-8cf0-43c099d04afb"
